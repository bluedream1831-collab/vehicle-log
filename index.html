<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>車輛紀錄系統</title>
    <style>
        :root {
            --primary-blue: #007bff;
            --secondary-gray: #6c757d;
            --success-green: #28a745;
            --danger-red: #d90429;
            --bg-light: #f8f9fa;
            --warning-red-bg: #fff0f0;
        }

        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }

        body { background-color: #e9ecef; margin: 0; padding: 10px; display: flex; justify-content: center; }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.4rem; }

        .section { margin-bottom: 15px; }

        label { display: block; font-size: 14px; margin-bottom: 5px; color: #555; font-weight: bold; }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background: #fff;
        }

        /* 快速標籤 */
        .quick-select { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            background: #e1f0ff;
            color: #0056b3;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #b3d7ff;
        }
        .tag:active { background: #007bff; color: white; }

        /* 橫向格線 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* 棧板區域 */
        .pallet-box { background: #fff9e6; padding: 10px; border-radius: 4px; border: 1px solid #ffeeba; }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-add { background-color: var(--primary-blue); width: 100%; margin-top: 10px; }

        /* 紀錄顯示卡片 */
        .record-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-left: 5px solid var(--primary-blue);
            border-radius: 4px;
            padding: 12px;
            margin-top: 12px;
        }

        /* 有回庫時的卡片樣式 */
        .card-alert {
            background: var(--warning-red-bg);
            border: 2px solid var(--danger-red);
            border-left: 10px solid var(--danger-red);
        }

        .card-head { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-body { font-size: 15px; color: #333; line-height: 1.5; }
        .del-btn { color: var(--danger-red); text-decoration: none; cursor: pointer; }

        /* 回庫字體加重 */
        .inbound-text { 
            font-size: 1.1rem;
            color: var(--danger-red); 
            font-weight: 900;
        }

        textarea {
            width: 100%;
            height: 160px;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fdfdfd;
            resize: none;
        }

        .footer { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
        .btn-copy { flex: 2; background-color: var(--success-green); }
        .btn-clear { flex: 1; background-color: var(--danger-red); font-size: 14px; }
        .btn-reset { flex: 1; background-color: var(--secondary-gray); font-size: 14px; }

        .hint { font-size: 10px; color: #999; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h2>車輛紀錄回報系統</h2>

    <div class="section">
        <label>日期</label>
        <input type="date" id="recordDate">
    </div>

    <div class="section">
        <label>車型</label>
        <input type="text" id="vehicleType" placeholder="選標籤或手動輸入">
        <div class="quick-select" id="quickSelect">
            <span class="tag">3PL幹線(南)</span>
            <span class="tag">3PL爆量1</span>
            <span class="tag">3PL爆量2</span>
            <span class="tag">3PL爆量3</span>
            <span class="tag">3PL爆量4</span>
            <span class="tag">3PL爆量5</span>
            <span class="tag">ES幹線車</span>
            <span class="tag">ES爆量1</span>
            <span class="tag">ES爆量2</span>
        </div>
    </div>

    <div class="section grid-2">
        <div>
            <label>到廠時間</label>
            <input type="text" id="arrivalTime" inputmode="numeric" placeholder="如 0830">
            <div class="hint">※自動轉 08:30</div>
        </div>
        <div>
            <label>離廠時間</label>
            <input type="text" id="departureTime" inputmode="numeric" placeholder="如 1200">
            <div class="hint">※未離可先不填</div>
        </div>
    </div>

    <div class="section pallet-box grid-2">
        <div>
            <label>出庫棧板</label>
            <input type="number" id="outPallets" inputmode="numeric" placeholder="0">
        </div>
        <div>
            <label>回庫棧板</label>
            <input type="number" id="inPallets" inputmode="numeric" placeholder="0">
        </div>
    </div>

    <button class="btn btn-add" onclick="addRecord()">＋ 新增紀錄</button>

    <div id="recordList"></div>

    <div class="section" style="margin-top: 20px;">
        <label>LINE 複製內容預覽</label>
        <textarea id="summaryText" readonly></textarea>
    </div>

    <div class="footer">
        <button class="btn btn-reset" onclick="location.reload()">重新整理</button>
        <button class="btn btn-clear" onclick="clearData()">清空紀錄</button>
        <button class="btn btn-copy" onclick="copyText()">一鍵複製內容</button>
    </div>
</div>

<script>
    // 初始化當天日期
    function initDate() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        document.getElementById('recordDate').value = `${y}-${m}-${d}`;
    }
    initDate();

    let records = JSON.parse(localStorage.getItem('vRecords_v10')) || [];

    document.getElementById('quickSelect').onclick = (e) => {
        if (e.target.className === 'tag') {
            document.getElementById('vehicleType').value = e.target.innerText;
        }
    };

    function fmtTime(v) {
        v = v.replace(/:/g, '').trim();
        if (v.length === 4 && !isNaN(v)) {
            return v.substring(0, 2) + ':' + v.substring(2, 4);
        }
        return v;
    }

    function addRecord() {
        const type = document.getElementById('vehicleType').value;
        const date = document.getElementById('recordDate').value;
        const arr = document.getElementById('arrivalTime').value;
        const dep = document.getElementById('departureTime').value;
        const outP = document.getElementById('outPallets').value || 0;
        const inP = document.getElementById('inPallets').value || 0;

        if (!type || !arr) return alert('請輸入車型與時間');

        records.push({
            id: Date.now(),
            date, type, 
            arrival: fmtTime(arr), 
            departure: dep ? fmtTime(dep) : '--',
            outP, inP
        });

        save();
        document.getElementById('arrivalTime').value = '';
        document.getElementById('departureTime').value = '';
        document.getElementById('outPallets').value = '';
        document.getElementById('inPallets').value = '';
    }

    function deleteRec(id) {
        if(confirm('確定刪除？')) {
            records = records.filter(r => r.id !== id);
            save();
        }
    }

    function clearData() {
        if(confirm('確定清空所有紀錄？')) {
            records = [];
            save();
        }
    }

    function save() {
        localStorage.setItem('vRecords_v10', JSON.stringify(records));
        render();
    }

    function render() {
        const list = document.getElementById('recordList');
        const sum = document.getElementById('summaryText');
        
        if (records.length === 0) {
            list.innerHTML = '';
            sum.value = '';
            return;
        }

        // 網頁端介面
        list.innerHTML = records.map((r, i) => {
            const hasIn = parseInt(r.inP) > 0;
            const alertClass = hasIn ? 'card-alert' : '';
            const inStyle = hasIn ? 'inbound-text' : '';
            return `
            <div class="record-card ${alertClass}">
                <div class="card-head"><span>#${i+1} | ${r.date}</span><span class="del-btn" onclick="deleteRec(${r.id})">刪除</span></div>
                <div class="card-body">
                    <b>${r.type}</b><br>
                    時間：${r.arrival} ~ ${r.departure}<br>
                    棧板：出 ${r.outP} / <span class="${inStyle}">${hasIn ? '🚨 回 ' + r.inP : '回 ' + r.inP}</span>
                </div>
            </div>`;
        }).join('');

        // LINE 格式內容
        let txt = `🚛【車輛進出回報】\n`;
        records.forEach((r, i) => {
            const sd = r.date.substring(5).replace('-', '/');
            const hasIn = parseInt(r.inP) > 0;
            txt += `\n#${i+1} ${r.type} (${sd})\n⏲ 時間：${r.arrival} - ${r.departure}\n`;
            if (hasIn) {
                // 修改處：加強回庫提示文字
                txt += `📦 棧板：出 ${r.outP} / 🔴回 ${r.inP} (請留意)\n`;
            } else {
                txt += `📦 棧板：出 ${r.outP} / 回 ${r.inP}\n`;
            }
            txt += `──────────`;
        });
        sum.value = txt;
    }

    async function copyText() {
        const t = document.getElementById('summaryText').value;
        if (!t) return;
        try {
            await navigator.clipboard.writeText(t);
            alert('內容已複製！');
        } catch (e) {
            document.getElementById('summaryText').select();
            document.execCommand('copy');
            alert('內容已複製！');
        }
    }

    render();
</script>

</body>
</html>
